name: Build & Deploy to FTP

on:
  push:
    branches:
      - main # Change to your target branch if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # Change to 'yarn' or 'pnpm' if you use a different package manager

      - name: Install dependencies
        run: npm ci # Change to 'yarn install --frozen-lockfile' or 'pnpm install --frozen-lockfile' if needed

      - name: Build project
        run: npm run build # Vite outputs to ./dist by default
        env:
          # Add your environment variables here if needed, e.g.:
          # VITE_API_URL: ${{ secrets.VITE_API_URL }}
          NODE_ENV: production

      - name: Upload dist to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }} # e.g. ftp.yourdomain.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }} # 21 for FTP, 22 for SFTP
          local-dir: ./dist/ # Vite build output folder
          server-dir: ${{ secrets.FTP_REMOTE_DIR }} # e.g. /public_html/ or /www/
          # Optional settings:
          # protocol: ftps                          # Uncomment for FTPS (recommended over plain FTP)
          # dry-run: true                           # Uncomment to test without uploading
          # exclude: |                              # Uncomment to exclude files
          #   **/.git*
          #   **/.git*/**
          #   **/node_modules/**
